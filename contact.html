<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | The Daily Draft</title>
<meta name="description" content="Get in touch with The Daily Draft.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-root="">
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="index.html">The Daily<span>Draft</span></a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#posts">Articles</a></li>
      <li><a href="about.html">About</a></li>
      <li><a class="active" href="contact.html">Contact</a></li>
    </ul>
    <div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main class="about">
  <h1>Contact</h1>
  <p>Questions, feedback or guest post ideas? Send a message and we will reply as soon as we can.</p>
  <form class="newsletter" style="text-align:left;display:grid;gap:12px" action="mailto:your-email@example.com" method="post" enctype="text/plain">
    <input type="text" name="name" required placeholder="Your name" aria-label="Your name" style="min-width:0">
    <input type="email" name="email" required placeholder="Your email" aria-label="Your email" style="min-width:0">
    <textarea name="message" required rows="5" placeholder="Your message" aria-label="Your message" style="padding:14px 20px;border-radius:14px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit"></textarea>
    <button class="btn" type="submit">Send message</button>
  </form>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>© <span id="year">2026</span> The Daily Draft. All rights reserved.</span>
    <span><a href="privacy.html">Privacy</a></span>
  </div>
</footer>
<script src="script.js"></script>
</body>
</html>
